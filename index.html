  <script type="module" src="app.js?v=3.1"></script>
  <script>
    // Güvenlik ağı: uygulama birkaç saniye içinde açılamazsa (ör. bozuk önbellek) onarma düğmesi göster.
    (function () {
      var errs = [];
      // Yalnızca uygulama dosyalarını (önbellek + servis çalışanı) siler; notlar (IndexedDB) silinmez.
      window.__knRepair = function () {
        var p = [];
        if ('serviceWorker' in navigator) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(p).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now() + location.hash); });
      };
      window.addEventListener('error', function (e) { errs.push((e.message || (e.target && (e.target.src || e.target.href)) || 'hata')); }, true);
      window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason && (e.reason.message || e.reason))); });
      setTimeout(function () {
        if (window.__knStarted) return;
        var v = document.getElementById('view');
        v.innerHTML = '<div class="empty"><div class="e">🛠️</div><h3>Uygulama açılamadı</h3>' +
          '<p>Büyük ihtimalle telefondaki eski dosyalar yenileriyle karıştı. Aşağıdaki düğme yalnızca uygulama dosyalarını yeniden indirir; <b>notlarınız silinmez</b>.</p>' +
          '<button class="btn primary" id="kn-repair">🔄 Onar ve yeniden aç</button>' +
          (errs.length ? '<p class="small muted" style="margin-top:14px;word-break:break-word">Ayrıntı: ' + errs.slice(0, 3).join(' · ').replace(/</g, '&lt;') + '</p>' : '') + '</div>';
        document.getElementById('kn-repair').onclick = window.__knRepair;
      }, 6000);
    })();
  </script>
